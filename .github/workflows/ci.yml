# CI: hotty-surf's gate, `make check`: gofmt, go mod tidy (which must change
# nothing), the generated files (templ's, msgp's), vet, staticcheck, the
# tests with the race detector, the API lock (api-check: no exported change
# outside api/next.txt) and the coverage page. On main, the API is frozen
# too: nothing exported that the maintainer hasn't approved (api-frozen).
#
# It runs on GitHub's runners only, and only while the repository is
# public: a public repository's CI runs on GitHub's runners, never a
# self-hosted one (gov NEIO-2).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Go, TinyGo, templ and msgp at the versions mise.toml pins.
      - uses: jdx/mise-action@v4

      # CAP= : the Makefile caps each step with systemd-run --user, which
      # a runner has no session for, and the runner is the job's alone.
      - run: make CAP= check

      - name: API approved
        if: github.ref == 'refs/heads/main'
        run: make CAP= api-frozen

      # The oldest Go an importer may build with: go.mod's go directive.
      - name: Go at go.mod's floor
        run: |
          export GOTOOLCHAIN=go$(go list -m -f '{{.GoVersion}}')
          go vet ./...
