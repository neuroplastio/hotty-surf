  id="c1"
  class="combobox "
  
  
  
  
>
  
  <div class="input-group w-40">
    <input
      type="text"
      role="combobox"
      placeholder=""
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
      aria-autocomplete="list"
      aria-expanded="false"
      aria-controls="c1-listbox"
      
        
      
    >
    <span role="group" data-align="inline-end">
      <button type="button" data-clear aria-label="Clear selection">

      </button>
    </span>
  </div>
  
  <div
    id="c1-popover"
    data-popover
    aria-hidden="true"
    
  >
    <div
      role="listbox"
      id="c1-listbox"
      aria-orientation="vertical"
      
      
    >
      <div role="option" data-value="x">X</div>

  </div>
  <input
    type="hidden"
    name="c"
    value=''
